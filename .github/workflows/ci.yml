# CI：每次 PR 与 main 推送时运行
# 目标：任何 PR 在合入前必须 静态检查 + 构建 + 冒烟测试 全部通过（与分支保护联动）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 检查名称为 "server"（分支保护 required_status_checks.contexts 使用该名称）
  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      - name: Pi 依赖安装、类型检查和单元测试
        run: make -C ai-service install lint test
      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libmicrohttpd-dev libcurl4-openssl-dev libsqlite3-dev
      - name: 静态检查（-fsyntax-only）
        run: make -C server lint
      - name: 构建（gcc -Wall -Wextra）
        run: make -C server build
      - name: 冒烟测试（健康检查 + 静态页）
        run: make -C server test
